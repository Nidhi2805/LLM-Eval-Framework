# Render deployment config — defines both services (API + dashboard).
# Free tier: no persistent disk, so the SQLite DB resets on restart.
# Production path is Postgres (swap via DATABASE_URL) — see README roadmap.
services:
  # --- Backend API ---
  - type: web
    name: rag-eval-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in the dashboard; never in the repo

  # --- Dashboard ---
  - type: web
    name: rag-eval-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    envVars:
      - key: API_BASE
        sync: false          # set to the API's URL after it deploys